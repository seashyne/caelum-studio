[package]
name = "caelum-studio"
version = "0.2.0"
description = "Caelum Studio — Native Tauri 2 Desktop App & Model Manager for the Caelum Pure-Rust LLM Runtime"
authors = ["seashyne"]
edition = "2021"

[workspace]

[lib]
name = "caelum_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "caelum-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
